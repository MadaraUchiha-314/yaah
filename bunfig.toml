[install]
exact = false

[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageThreshold = { lines = 0.9, functions = 0.9 }
coverageSkipTestFiles = true
# shadcn/ui components are copied in whole; the chat uses a part of each. They are
# vendored code, not ours to cover line by line.
coveragePathIgnorePatterns = ["src/surface/renderer/web/components/ui/**"]
