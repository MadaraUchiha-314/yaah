# commitizen — Conventional Commits enforcement AND the project's version of record.
#
# Enforcement: the `commit-msg` pre-commit hook runs `cz check`, so a message that does
# not match Conventional Commits v1.0.0 never becomes a commit. This is the loop's rule
# (reference/tooling.md), and it uses commitizen rather than a bespoke validator.
#
# Versioning: on merge to main, .github/workflows/release.yml runs `cz bump`, which reads
# the conventional-commit types since the last tag (feat -> minor, fix -> patch,
# BREAKING CHANGE / ! -> major), rewrites the version here and in every `version_files`
# entry, commits `bump: ...` and tags it. See docs/decisions/decision-003.md.
# https://commitizen-tools.github.io/commitizen/
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_scheme = "semver"
# commitizen owns the canonical version above; `version_files` keeps every other file
# carrying it in lockstep, so one bump rewrites them together and the published
# distribution can never disagree with the git tag. On a matching line commitizen
# replaces the CURRENT version string, so the target must already carry it.
version_files = [
    "pyproject.toml:^version = ",
]
# The changelog is generated by the release workflow (`cz bump --changelog`), not
# committed from a developer machine — so a local `cz bump` does not require one.
update_changelog_on_bump = false
