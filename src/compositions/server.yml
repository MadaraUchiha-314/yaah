# Root composition of the server build. Entries are addressed by id: an operator replaces
# any of them with an [[overrides]] table in config.toml.
- id: core-layer
  name: '@cordisjs/include'
  config:
    path: ./shared/core.yml
- id: models-layer
  name: '@cordisjs/include'
  config:
    path: ./shared/models.yml
- id: app-layer
  name: '@cordisjs/include'
  config:
    path: ./shared/app.yml
- id: o11y
  name: ../app/o11y/index.ts
- id: extensions-layer
  name: '@cordisjs/include'
  config:
    path: ./shared/extensions.yml
- id: http-layer
  name: '@cordisjs/include'
  config:
    path: ./shared/http.yml
